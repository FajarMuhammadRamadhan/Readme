<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Search — createElement & textContent only</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f6fa;
    color: #1f2430;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 560px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.note { color: #6b7280; font-size: 0.9rem; margin-top: 0; margin-bottom: 20px; }
  input#search {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid #e1e4ea;
    border-radius: 8px;
    outline: none;
    background: #fff;
  }
  input#search:focus {
    border-color: #2f6fed;
    box-shadow: 0 0 0 3px #eaf1ff;
  }
  ul#results {
    list-style: none;
    margin: 16px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  li.result-item {
    background: #fff;
    border: 1px solid #e1e4ea;
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .name { font-weight: 600; }
  .category {
    font-size: 0.8rem;
    color: #6b7280;
    background: #eaf1ff;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .empty-state { color: #6b7280; text-align: center; padding: 24px 0; font-size: 0.95rem; }
  .count { font-size: 0.8rem; color: #6b7280; margin-top: 10px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Live Search — Data Buah &amp; Sayur</h1>
    <p class="note">
      Implementasi ini murni pakai <code>createElement</code> dan
      <code>textContent</code>, tanpa <code>innerHTML</code> sama sekali.
    </p>

    <input type="text" id="search" placeholder="Cari nama item... (mis. 'apel', 'wortel')" autocomplete="off" />

    <ul id="results"></ul>
    <div class="count" id="count"></div>
  </div>

  <script>
    // 1. Data array
    const items = [
      { name: "Apel Fuji", category: "Buah" },
      { name: "Alpukat", category: "Buah" },
      { name: "Anggur Merah", category: "Buah" },
      { name: "Bayam", category: "Sayur" },
      { name: "Brokoli", category: "Sayur" },
      { name: "Buncis", category: "Sayur" },
      { name: "Ceri", category: "Buah" },
      { name: "Cabai Rawit", category: "Sayur" },
      { name: "Durian", category: "Buah" },
      { name: "Jeruk Bali", category: "Buah" },
      { name: "Jagung Manis", category: "Sayur" },
      { name: "Kangkung", category: "Sayur" },
      { name: "Kentang", category: "Sayur" },
      { name: "Kiwi", category: "Buah" },
      { name: "Mangga Harum Manis", category: "Buah" },
      { name: "Melon", category: "Buah" },
      { name: "Nanas", category: "Buah" },
      { name: "Pisang Cavendish", category: "Buah" },
      { name: "Pepaya", category: "Buah" },
      { name: "Terong Ungu", category: "Sayur" },
      { name: "Tomat", category: "Sayur" },
      { name: "Wortel", category: "Sayur" },
    ];

    // 2. Ambil elemen
    const searchInput = document.getElementById("search");
    const resultsList = document.getElementById("results");
    const countLabel = document.getElementById("count");

    // 3. Fungsi render — bangun DOM manual, TANPA innerHTML
    function renderResults(data) {
      while (resultsList.firstChild) {
        resultsList.removeChild(resultsList.firstChild);
      }

      if (data.length === 0) {
        const emptyItem = document.createElement("li");
        emptyItem.className = "empty-state";
        emptyItem.textContent = "Tidak ada hasil yang cocok.";
        resultsList.appendChild(emptyItem);
        countLabel.textContent = "";
        return;
      }

      data.forEach((item) => {
        const li = document.createElement("li");
        li.className = "result-item";

        const nameSpan = document.createElement("span");
        nameSpan.className = "name";
        nameSpan.textContent = item.name;

        const categorySpan = document.createElement("span");
        categorySpan.className = "category";
        categorySpan.textContent = item.category;

        li.appendChild(nameSpan);
        li.appendChild(categorySpan);
        resultsList.appendChild(li);
      });

      countLabel.textContent = `${data.length} hasil ditemukan`;
    }

    // 4. Filter real-time
    searchInput.addEventListener("input", (e) => {
      const query = e.target.value.trim().toLowerCase();
      const filtered = items.filter((item) =>
        item.name.toLowerCase().includes(query)
      );
      renderResults(filtered);
    });

    // 5. Render awal
    renderResults(items);
  </script>
</body>
</html>
